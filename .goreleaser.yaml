version: 2
project_name: saral
report_sizes: true

# A GITLAB_TOKEN in the environment is otherwise enough to retarget every release URL.
force_token: github

before:
  hooks:
    - go mod tidy
    - git diff --exit-code

builds:
  - id: saral
    main: ./cmd/saral
    binary: saral
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, docs/INSTALL.md, docs/SETTINGS.md, docs/UX.md, docs/FIELDS.md, docs/FILTERS.md]

nfpms:
  - id: saral
    package_name: saral
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm, apk]
    maintainer: Varij Kapil <varij.kapil@it-manufactory.com>
    homepage: https://github.com/varijkapil13/saral
    description: Jira in your terminal, made simple
    license: MIT
    contents:
      - src: README.md
        dst: /usr/share/doc/saral/README.md
      - src: LICENSE
        dst: /usr/share/doc/saral/LICENSE

checksum:
  name_template: checksums.txt

sboms:
  - id: archive
    artifacts: archive

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  format: "{{ .Message }}"
  groups:
    - title: Features
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\([^)]*\))?!?:'
      order: 2
    - title: Refactoring
      regexp: '^refactor(\([^)]*\))?!?:'
      order: 3
    - title: Other changes
      order: 9
  filters:
    exclude: ['^docs', '^test', '^chore', '^ci', '^Merge ']

homebrew_casks:
  - name: saral
    repository:
      owner: varijkapil13
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    # Without a tap to push to, publishing the release still has to succeed.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/varijkapil13/saral
    description: Jira in your terminal, made simple
    license: MIT
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"], print_stderr: false).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/saral"]
          end
    zap:
      trash:
        - ~/.config/saral
        - ~/.cache/saral

release:
  prerelease: auto
  # So re-running a tag's workflow is a retry rather than a conflict.
  replace_existing_artifacts: true
