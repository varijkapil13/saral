name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_VERSION: v2.12.2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: tidy is clean
        run: go mod tidy && git diff --exit-code
      - name: vet
        run: go vet ./...
      - name: warm the caches while the network is still there
        run: go test -race -count=1 -run '^$' ./...
      - name: test with race detector, on a loopback-only network
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" \
            "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            GOPROXY=off GOTOOLCHAIN=local \
            unshare -n -- sh -euc '
              ip link set lo up
              ip -o link show lo | grep -qw UP || { echo "::error::loopback is down inside the namespace"; exit 1; }
              command -v curl >/dev/null || { echo "::error::no curl to prove the namespace isolates"; exit 1; }
              if curl -sS --max-time 5 -o /dev/null https://proxy.golang.org; then
                echo "::error::a request left the namespace, so this check proves nothing"
                exit 1
              fi
              go test -race -count=1 ./...
            '
      - name: give the caches back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$(go env GOCACHE)" "$(go env GOMODCACHE)"
      - name: build
        run: go build -trimpath -ldflags "-s -w" -o saral ./cmd/saral
      - name: binary size budget
        run: |
          size=$(stat -c%s saral)
          echo "binary: $size bytes"
          limit=$((15 * 1024 * 1024))
          if [ "$size" -gt "$limit" ]; then
            echo "::error::binary exceeds 15 MiB budget (see docs/PERFORMANCE.md)"
            exit 1
          fi
      # The whole process, the way hyperfine would time it, against a cache
      # directory with nothing in it — which is the no-cache row of the budget
      # table. Best of five, because a shared runner is noisy and the budget is
      # about how fast the binary can start, not how busy the host was.
      - name: cold start budget
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys, time

          env = dict(os.environ)
          for var in ("SARAL_CONFIG_DIR", "SARAL_CACHE_DIR"):
              d = pathlib.Path(env["RUNNER_TEMP"]) / var.lower()
              d.mkdir(parents=True, exist_ok=True)
              env[var] = str(d)

          best = None
          for _ in range(5):
              started = time.perf_counter()
              subprocess.run(["./saral", "--bench-first-paint"],
                             stdout=subprocess.DEVNULL, env=env, check=True)
              took = (time.perf_counter() - started) * 1000
              print("start to first paint: %.0f ms" % took, flush=True)
              best = took if best is None else min(best, took)

          print("best of five: %.0f ms" % best)
          if best > 250:
              print("::error::cold start to first paint took %.0f ms with an empty cache, "
                    "over the 250 ms budget (see docs/PERFORMANCE.md)" % best)
              sys.exit(1)
          PY

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: warm the caches while the network is still there
        run: go test -count=1 -run '^$' ./...
      # Every guard is built `!race`, so this is the only lane that runs one. It
      # drops the detector because the detector is what the numbers would
      # otherwise measure, and keeps the namespace because dropping it here is
      # the one place a test could reach the network unwatched.
      - name: hold the budgets, without the detector and on a loopback-only network
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" \
            "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            GOPROXY=off GOTOOLCHAIN=local \
            unshare -n -- sh -euc '
              ip link set lo up
              ip -o link show lo | grep -qw UP || { echo "::error::loopback is down inside the namespace"; exit 1; }
              command -v curl >/dev/null || { echo "::error::no curl to prove the namespace isolates"; exit 1; }
              if curl -sS --max-time 5 -o /dev/null https://proxy.golang.org; then
                echo "::error::a request left the namespace, so this check proves nothing"
                exit 1
              fi
              go test -count=1 -parallel 1 -json -run "^TestBudget_" ./... > budgets.json
            '
      - name: the guards that ran are the ones docs/PERFORMANCE.md names
        if: always()
        run: |
          python3 - budgets.json docs/PERFORMANCE.md <<'PY'
          import json, re, sys

          results, doc = sys.argv[1], sys.argv[2]

          module = ""
          for line in open("go.mod"):
              if line.startswith("module "):
                  module = line.split()[1]
                  break

          ran, failed, output = set(), set(), {}
          for line in open(results):
              try:
                  ev = json.loads(line)
              except ValueError:
                  continue
              test = ev.get("Test", "")
              if not test.startswith("TestBudget_") or "/" in test:
                  continue
              pkg = ev["Package"].removeprefix(module).lstrip("/")
              if ev["Action"] in ("pass", "fail", "skip"):
                  ran.add((pkg, test))
              if ev["Action"] == "fail":
                  failed.add((pkg, test))
              if ev["Action"] == "output":
                  output.setdefault((pkg, test), []).append(ev["Output"])

          table = re.search(r"<!-- budget-guards -->(.*?)<!-- /budget-guards -->", open(doc).read(), re.S)
          if table is None:
              sys.exit("%s has no guard table between the budget-guards markers" % doc)
          named = set()
          for row in table.group(1).splitlines():
              cells = [c.strip().strip("`") for c in row.strip().split("|")]
              if len(cells) == 4 and cells[2].startswith("TestBudget_"):
                  named.add((cells[1], cells[2]))

          for pkg, test in sorted(failed):
              print("::group::%s %s" % (pkg, test))
              print("".join(output.get((pkg, test), [])))
              print("::endgroup::")

          bad = False
          for pkg, test in sorted(named - ran):
              bad = True
              print("::error::%s names %s in %s and it did not run. A guard nothing runs is a comment." % (doc, test, pkg))
          for pkg, test in sorted(ran - named):
              bad = True
              print("::error::%s ran in %s and %s does not name it. Add the row, so the document stays the inventory of what holds the budgets." % (test, pkg, doc))
          if failed:
              bad = True
              print("::error::%d budget guard(s) failed; the groups above have the numbers." % len(failed))
          print("%d guards ran, %d named in %s" % (len(ran), len(named), doc))
          sys.exit(1 if bad else 0)
          PY
      - name: give the caches back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$(go env GOCACHE)" "$(go env GOMODCACHE)"

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # In this order: a check that has never been seen to fail proves nothing green.
      - name: the leak check catches what it claims to
        run: python3 scripts/checkleak_test.py
      - name: nothing from a real instance reached the fixtures
        run: python3 scripts/checkleak.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
      - name: lint
        run: golangci-lint run

  crossbuild:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
