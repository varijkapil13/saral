name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

# Two tags in quick succession would race each other for the tap.
concurrency:
  group: release-${{ github.ref }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.2
          install-only: true
      # A tag pushed straight to main without going through a PR never ran the jailed
      # race suite; this is the one place that gap gets closed before goreleaser ships.
      - name: vet
        run: go vet ./...
      - name: test with race detector
        run: go test -race -count=1 ./...
      - name: the config is valid
        run: goreleaser check
      # goreleaser publishes the release before it touches the tap, and cannot roll back.
      - name: the tap is reachable, or there is no tap to reach
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: varijkapil13/homebrew-tap
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is unset; publishing the GitHub release and no cask"
            exit 0
          fi
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$TAP")
          if [ "$code" != 200 ]; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot reach $TAP (HTTP ${code:-none}); nothing published"
            exit 1
          fi
          echo "::notice::the Homebrew cask will be pushed to $TAP"
      - name: release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
