name: macos
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `unshare -n` equivalent is available on the macos-latest runner, so this
  # job cannot prove network isolation the way ci.yml's jailed run does; it
  # catches macOS-specific build and runtime differences, not network reaches.
  # The suite is written to need none (docs/TESTING.md), which is what makes
  # running it unjailed here honest rather than a gap.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: build
        run: go build -trimpath -ldflags "-s -w" -o saral ./cmd/saral
      - name: test with race detector
        run: go test -race -count=1 ./...
