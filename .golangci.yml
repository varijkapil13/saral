version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - usestdlibvars
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      # hugeParam fires on every Bubble Tea value receiver; MVU requires them.
      disabled-checks: [whyNoLint, hugeParam]
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
